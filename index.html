<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restoran "Gusto" - AI Konobar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #12181f; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid #232d38; background-color: #1a222d; }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 44px; height: 44px; background-color: #f59e0b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .title-area h1 { font-size: 18px; font-weight: 700; }
    .title-area p { font-size: 13px; color: #9ca3af; }
    .settings-btn { background: none; border: none; color: #9ca3af; font-size: 22px; cursor: pointer; }
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .bot-message { background-color: #232d38; color: #e5e7eb; align-self: flex-start; border-bottom-left-radius: 4px; }
    .user-message { background-color: #f59e0b; color: #000000; font-weight: 500; align-self: flex-end; border-bottom-right-radius: 4px; }
    .input-area { padding: 16px; background-color: #1a222d; border-top: 1px solid #232d38; display: flex; gap: 10px; }
    #user-input { flex: 1; background-color: #12181f; border: 1px solid #232d38; border-radius: 24px; padding: 14px 18px; color: #ffffff; font-size: 15px; outline: none; }
    #send-btn { width: 46px; height: 46px; background-color: #f59e0b; border: none; border-radius: 50%; color: #000000; font-size: 18px; cursor: pointer; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <div class="logo-icon">🍴</div>
      <div class="title-area">
        <h1>Restoran "Gusto"</h1>
        <p>AI Konobar na usluzi</p>
      </div>
    </div>
    <button class="settings-btn" id="settings-btn" title="Podesi API ključ">⚙️</button>
  </header>

  <div id="chat-container">
    <div class="message bot-message">
      Dobar dan! Ja sam Vaš digitalni konobar. Slobodno me pitajte za preporuku jela, sastojke, vina ili radno vreme! 🍽️
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Pitajte konobara ili naručite..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>

  <script>
    // System Instruction - Instrukcije za AI konobara
    const SYSTEM_INSTRUCTION = "Ti si ljubazan i profesionalan AI konobar u restoranu Gusto. Odgovaraj direktno, jasno i na srpskom jeziku.";

    function getApiKey() {
      let key = localStorage.getItem('gemini_api_key');
      if (!key) {
        key = prompt("Unesite Vaš Google Gemini API ključ:");
        if (key) {
          localStorage.setItem('gemini_api_key', key.trim());
        }
      }
      return key;
    }

    document.getElementById('settings-btn').onclick = () => {
      const currentKey = localStorage.getItem('gemini_api_key') || '';
      const newKey = prompt("Izmenite Vaš Gemini API ključ:", currentKey);
      if (newKey !== null) {
        localStorage.setItem('gemini_api_key', newKey.trim());
        alert("API ključ je sačuvan!");
      }
    };

    // Zvanični Interactions API poziv koji ne zavisi od starih naziva modela
    async function callInteractionsAPI(userMessage, apiKey) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;


      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
        system_instruction: {
          parts: [{ text: SYSTEM_INSTRUCTION }]
        },
        contents: [{
          parts: [{ text: userMessage }]
        }]
      })


      const data = await response.json();

      if (!response.ok || data.error) {
        // Fallback na klasičan generateContent ako Interactions API vrati grešku
        return await callFallbackAPI(userMessage, apiKey);
      }

      if (data.output) {
        return data.output;
      }

      throw new Error("Nije dobijen odgovor.");
    }

    // Rezervni poziv ako primarni API vrati bilo kakvu grešku
    async function callFallbackAPI(userMessage, apiKey) {
      const fallbackUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const response = await fetch(fallbackUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents: [{ parts: [{ text: userMessage }] }]
        })
      });

      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error("proverite API key ili internet konekciju");
      }

      return data.candidates[0].content.parts[0].text;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const text = inputEl.value.trim();

      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        alert("Morate uneti API ključ.");
        return;
      }

      appendMessage(text, 'user-message');
      inputEl.value = '';
      sendBtn.disabled = true;

      const loadingId = appendMessage('Konobar kuca odgovor...', 'bot-message');

      try {
        const reply = await callInteractionsAPI(text, apiKey);
        updateMessage(loadingId, reply);
      } catch (error) {
        updateMessage(loadingId, `Problem pri slanju: ${error.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, className) {
      const container = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      const id = 'msg-' + Date.now();
      msgDiv.id = id;
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function updateMessage(id, newText) {
      const msgDiv = document.getElementById(id);
      if (msgDiv) {
        msgDiv.innerText = newText;
        const container = document.getElementById('chat-container');
        container.scrollTop = container.scrollHeight;
      }
    }
  </script>
</body>
</html>
