<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitalni Konobar - Gusto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 10px; text-align: center; background-color: #1e293b; font-weight: bold; border-bottom: 1px solid #334155; }
    
    /* Traka za ključ */
    #key-bar { background: #b91c1c; padding: 8px; text-align: center; font-size: 12px; display: flex; gap: 5px; justify-content: center; }
    #key-bar input { padding: 4px; border-radius: 4px; border: none; width: 60%; }
    #key-bar button { padding: 4px 8px; background: #fff; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 12px 16px; border-radius: 16px; max-width: 85%; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .user-message { background-color: #ffab00; color: #000 !important; align-self: flex-end; }
    .bot-message { background-color: #1e293b; color: #fff !important; align-self: flex-start; border: 1px solid #334155; }
    
    .input-container { display: flex; padding: 12px 15px; background-color: #1e293b; gap: 10px; }
    #user-input { flex: 1; background-color: #0f172a; border: 1px solid #334155; color: #fff !important; padding: 12px 16px; border-radius: 25px; font-size: 15px; }
    #send-btn { background-color: #ffab00; color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; font-weight: bold; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">🍽️ Digitalni Konobar - Restoran Gusto</div>

  <!-- Polje na vrhu da odmah vidiš koji se ključ koristi -->
  <div id="key-bar">
    <input type="password" id="api-key-input" placeholder="Nalepi Gemini API Ključ ovde...">
    <button onclick="sacuvajKluc()">Sačuvaj Ključ</button>
  </div>

  <div id="chat-box">
    <div class="message bot-message">
      Dobar dan! Ja sam vaša podrška. Ukucajte pitanje i kliknite na žutu strelicu! 🍽️
    </div>
  </div>

  <div class="input-container">
    <input type="text" id="user-input" placeholder="Pitajte konobara..." autocomplete="off">
    <button id="send-btn" type="button" onclick="posaljiPoruku()">❯</button>
  </div>

  <script>
    // Učitaj ključ ako postoji
    document.getElementById('api-key-input').value = localStorage.getItem('moj_gemini_key') || '';

    function sacuvajKluc() {
      const val = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('moj_gemini_key', val);
      alert('Ključ sačuvan!');
    }

    async function posaljiPoruku() {
      const key = localStorage.getItem('moj_gemini_key') || document.getElementById('api-key-input').value.trim();
      
      if (!key) {
        alert('PRVO UNESITE API KLJUČ U CRVENU TRAKU NA VRHU!');
        return;
      }

      const input = document.getElementById('user-input');
      const tekst = input.value.trim();
      if (!tekst) return;

      input.value = '';
      prikazi('user', tekst);
      const tempId = prikazi('bot', '<i>Konobar razmišlja...</i>');

      try {
        // Zovemo isključivo stabilni 1.5-flash
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Ti si konobar restorana Gusto. Odgovori kratko: " + tekst }] }]
          })
        });

        const data = await res.json();

        if (data.error) {
          azuriraj(tempId, '❌ API GREŠKA: ' + data.error.message);
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          azuriraj(tempId, data.candidates[0].content.parts[0].text);
        } else {
          azuriraj(tempId, '❌ Nepoznat odgovor od servera.');
        }

      } catch (err) {
        azuriraj(tempId, '❌ MREŽNA GREŠKA: ' + err.message);
      }
    }

    function prikazi(ko, tekst) {
      const chat = document.getElementById('chat-box');
      const div = document.createElement('div');
      const id = 'msg-' + Date.now();
      div.id = id;
      div.className = `message ${ko}-message`;
      div.innerHTML = tekst;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return id;
    }

    function azuriraj(id, tekst) {
      const el = document.getElementById(id);
      if (el) {
        el.innerHTML = tekst;
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
      }
    }

    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); posaljiPoruku(); }
    });
  </script>
</body>
</html>
