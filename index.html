<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitalni Konobar</title>
  <style>
    /* =========================================================
       1. CSS VARIJABLE (TEMA I BOJE - PRILAGODI ZA SVAKI RESTORAN)
       ========================================================= */
    :root {
      --bg-color: #0f172a;          /* Glavna pozadina (Tamno plava / Dark) */
      --card-bg: #1e293b;        /* Pozadina poruka i kontrola */
      --user-msg-bg: #334155;    /* Pozadina poruka korisnika */
      --bot-msg-bg: #1e293b;     /* Pozadina poruka bot-a */
      --primary-accent: #f59e0b; /* Glavna akcentna boja (Zlatno/Narandžasta) */
      --text-main: #f8fafc;      /* Boja glavnog teksta */
      --text-muted: #94a3b8;     /* Boja sporednog teksta */
      --border-color: #334155;   /* Boja linija i okvira */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Glavni kontejner telefona / aplikacije */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    /* Zaglavlje (Header) */
    .header {
      padding: 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-subtitle {
      font-size: 0.8rem;
      color: var(--primary-accent);
      margin-top: 2px;
    }

    /* Sekcija sa porukama (Chat Area) */
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bot-msg {
      background-color: var(--bot-msg-bg);
      color: var(--text-main);
      align-self: flex-start;
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .user-msg {
      background-color: var(--primary-accent);
      color: #000000;
      font-weight: 500;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Indikator kucanja (Typing Indicator) */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background-color: var(--bot-msg-bg);
      padding: 12px 16px;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Brza navigaciona dugmad */
    .quick-nav {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    .quick-btn {
      background-color: var(--card-bg);
      color: var(--primary-accent);
      border: 1px solid var(--primary-accent);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-btn:active {
      transform: scale(0.95);
      background-color: var(--primary-accent);
      color: #000;
    }

    /* Unos poruke i dugme za slanje */
    .input-area {
      padding: 12px 16px;
      background-color: var(--card-bg);
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border-color);
    }

    .input-area input {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 12px 18px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-area input:focus {
      border-color: var(--primary-accent);
    }

    .send-btn {
      background-color: var(--primary-accent);
      color: #000;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Modal za Rezervacije */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 360px;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--primary-accent);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-submit {
      flex: 1;
      background-color: var(--primary-accent);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div>
        <div class="header-title">Restoran "Gusto"</div>
        <div class="header-subtitle">● Vaš Digitalni Konobar</div>
      </div>
    </div>

    <!-- Chat sekcija -->
    <div class="chat-box" id="chatBox">
      <div class="message bot-msg">Dobar dan! Ja sam vaš Digitalni Konobar restorana "Gusto". Kako vam mogu pomoći danas? 🍽️</div>
      
      <!-- Typing Indicator -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <!-- Quick Navigation -->
    <div class="quick-nav">
      <button class="quick-btn" onclick="sendQuickMessage('Prikaži mi jelovnik')">🍽️ Jelovnik</button>
      <button class="quick-btn" onclick="openReservationModal()">📅 Rezervacija</button>
      <button class="quick-btn" onclick="sendQuickMessage('Koje je radno vreme?')">🕒 Radno vreme</button>
    </div>

    <!-- Unos poruke -->
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Pitajte konobara..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">❯</button>
    </div>
  </div>

  <!-- Modal za Rezervacije -->
  <div class="modal" id="resModal">
    <div class="modal-content">
      <div class="modal-title">Brza Rezervacija Stola</div>
      <div class="form-group">
        <label>Ime i Prezime</label>
        <input type="text" id="resName" placeholder="Petar Petrović">
      </div>
      <div class="form-group">
        <label>Broj Osoba</label>
        <input type="number" id="resGuests" value="2" min="1" max="20">
      </div>
      <div class="form-group">
        <label>Datum i Vreme</label>
        <input type="datetime-local" id="resDateTime">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeReservationModal()">Otkaži</button>
        <button class="btn-submit" onclick="submitReservation()">Potvrdi</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       2. KONFIGURACIJA AI MODELA I ZNANJA (SISTEMSKA UPUTSTVA)
       ========================================================= */
    const GEMINI_API_KEY = "TVOJ_GEMINI_API_KEY"; // Ovde unosiš važeći API ključ

    const SYSTEM_INSTRUCTION = `
    Ti si ljubazan i profesionalan AI Digitalni Konobar restorana "Gusto".
    Ogovaraš kratko, jasno i privlačno na srpskom jeziku.
    Dozvoljeno ti je da odgovaraš ISKLJUČIVO na pitanja vezana za restoran Gusto, njegov jelovnik, pića, radno vreme i rezervacije.

    JEKOVNIK RESTORANA "GUSTO":
    [PREDJELA]
    - Biftek tartari (200g) – 14€ / 1650 RSD
    - Burata sa čeri paradajzom – 9€ / 1050 RSD
    - Domaća teleća čorba – 4€ / 470 RSD

    [GLAVNA JELA & PASTE]
    - Tagliatelle sa tartufima – 13€ / 1530 RSD
    - Spaghetti Carbonara – 10€ / 1180 RSD
    - Piletina u sosu od gorgonzole – 11€ / 1300 RSD
    - Teleći medaljoni u sosu od vrganja – 16€ / 1880 RSD
    - Premium Burger "Gusto" – 9.5€ / 1120 RSD

    [POSLASTICE]
    - Tiramisu kućni recept – 4.5€ / 530 RSD
    - San Sebastijan čizkejk – 5€ / 590 RSD

    [PIĆA & VINA]
    - Kafa / Espresso – 1.8€ / 210 RSD
    - Limunada sa nanom – 3€ / 350 RSD
    - Kućno crveno / belo vino (čaša) – 4€ / 470 RSD

    INFORMACIJE:
    Radno vreme: Ponedeljak - Nedelja: 08:00 - 23:00h
    Lokacija: Bulevar Krafna 12, Beograd
    `;

    let chatHistory = [];

    /* =========================================================
       3. LOGIKA ZA SLANJE PORUKA I GEMINI API POZIV
       ========================================================= */
    async function sendMessage() {
      const inputEl = document.getElementById("userInput");
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, "user-msg");
      inputEl.value = "";

      showTyping(true);

      chatHistory.push({ role: "user", parts: [{ text: text }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: chatHistory
          })
        });

        const data = await response.json();
        showTyping(false);

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, "bot-msg");
          chatHistory.push({ role: "model", parts: [{ text: reply }] });
        } else {
          appendMessage("Izvinite, trenutno ne mogu da obradim zahtev. Pokušajte ponovo.", "bot-msg");
        }
      } catch (err) {
        showTyping(false);
        appendMessage("Došlo je do greške u povezivanju sa konobarom.", "bot-msg");
      }
    }

    function sendQuickMessage(text) {
      document.getElementById("userInput").value = text;
      sendMessage();
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById("chatBox");
      const typingIndicator = document.getElementById("typingIndicator");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;

      chatBox.insertBefore(msgDiv, typingIndicator);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping(show) {
      const indicator = document.getElementById("typingIndicator");
      const chatBox = document.getElementById("chatBox");
      indicator.style.display = show ? "block" : "none";
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    /* =========================================================
       4. MODAL I SPREMANJE REZERVACIJA (LOCALSTORAGE)
       ========================================================= */
    function openReservationModal() {
      document.getElementById("resModal").style.display = "flex";
    }

    function closeReservationModal() {
      document.getElementById("resModal").style.display = "none";
    }

    function submitReservation() {
      const name = document.getElementById("resName").value.trim();
      const guests = document.getElementById("resGuests").value;
      const datetime = document.getElementById("resDateTime").value;

      if (!name || !datetime) {
        alert("Molimo vas unesite ime i vreme rezervacije.");
        return;
      }

      const reservation = { name, guests, datetime, createdAt: new Date().toISOString() };
      
      // Čuvanje u localstorage
      let bookings = JSON.parse(localStorage.getItem("gusto_bookings") || "[]");
      bookings.push(reservation);
      localStorage.setItem("gusto_bookings", JSON.stringify(bookings));

      closeReservationModal();
      appendMessage(`Uspešno ste poslali zahtev za rezervaciju na ime ${name} za ${guests} osoba (${datetime}). Očekujemo vas! 🥂`, "bot-msg");
    }
  </script>
</body>
</html>
