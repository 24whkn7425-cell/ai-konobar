<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restoran "Gusto" - AI Konobar</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121824; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-btns { display: flex; gap: 10px; }
    .chat-box { flex: 1; overflow-y: auto; background: #1a2232; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.4; word-break: break-word; }
    .bot { background: #2a3447; align-self: flex-start; }
    .user { background: #f59e0b; color: #000; align-self: flex-end; font-weight: 500; }
    .typing { font-style: italic; opacity: 0.7; }
    .input-box { display: flex; gap: 10px; margin-top: 15px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a3447; color: #fff; outline: none; font-size: 16px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; font-size: 18px; }

    /* Modal za pregled rezervacija */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; z-index: 100; }
    .modal-content { background: #1a2232; border-radius: 12px; padding: 20px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3447; padding-bottom: 10px; margin-bottom: 15px; }
    .res-card { background: #2a3447; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #f59e0b; }
    .close-btn { background: #ff6b6b; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Restoran "Gusto"</h2>
    <div class="header-btns">
      <button onclick="toggleModal()" style="background:none; color:#fff;" title="Pregled rezervacija">📋</button>
      <button onclick="setApiKey()" style="background:none; color:#fff;" title="Podešavanje API ključa">⚙️</button>
    </div>
  </div>

  <div class="chat-box" id="chat">
    <div class="msg bot">Dobar dan! Ja sam Vaš digitalni konobar. Izvolite, šta Vas zanima iz naše ponude? 🍽️</div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Pitajte konobara..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button type="button" onclick="sendMsg()">></button>
  </div>

  <!-- Modal panel za rezervacije -->
  <div class="modal" id="resModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin:0;">Evidencija Rezervacija</h3>
        <button class="close-btn" onclick="toggleModal()">X</button>
      </div>
      <div id="resList">Nema zabeleženih rezervacija.</div>
      <button onclick="clearReservations()" style="margin-top:15px; width:100%; background:#ff6b6b; color:#fff; font-size:14px; padding:8px;">Obriši sve rezervacije</button>
    </div>
  </div>

  <script>
    const SYSTEM_INSTRUCTION = `Ti si 'Digitalni Konobar', ljubazni i profesionalni AI asistent restorana 'Gusto'. Tvoj cilj je da pružiš vrhunsku uslugu, odgovaraš na pitanja o hrani i piću i prikupljaš rezervacije.

JELOVNIK RESTORANA "GUSTO":

[PREDJELA]
- Biftek tartari (200g) – 14€ / 1650 RSD (Sveže juneće meso, maslac, tostirani hleb)
- Burata sa čeri paradajzom – 9€ / 1050 RSD (Sveža burata, pesto sos, čeri, rikola)
- Domaća teleća čorba – 4€ / 470 RSD

[GLAVNA JELA & PASTE]
- Tagliatelle sa tartufima – 13€ / 1530 RSD (Sveže taljatete, crni tartufi, neutralna pavlaka, parmezan)
- Spaghetti Carbonara – 10€ / 1180 RSD (Guanciale sušeni obraz, žumance, pekorino sir, crni biber)
- Piletina u sosu od gorgonzole – 11€ / 1300 RSD (Grilovani pileći file, sos od gorgonzole, aromatični krompir)
- Teleći medaljoni u sosu od vrganja – 16€ / 1880 RSD (Teleći bife, umak od vrganja, pire krompir)
- Premium Burger "Gusto" – 9.5€ / 1120 RSD (100% junetina, čedar sir, karamelizovani luk, hrskava slanina, pomfrit)

[POSLASTICE]
- Tiramisu kućni recept – 4.5€ / 530 RSD
- San Sebastijan čizkejk – 5€ / 590 RSD (Sa prelivom od topljene mliječne čokolade)

[PIĆA & VINA]
- Kafa / Espresso – 1.8€ / 210 RSD
- Limunada sa nanom – 3€ / 350 RSD
- Kućno crveno / belo vino (čaša 0.15l) – 4€ / 470 RSD
- Vinarija Kovačević Aurelius (flaša 0.75l) – 28€ / 3300 RSD

INFORMACIJE O RESTORANU:
- Radno vreme: Svaki dan od 08:00 do 23:00.
- Adresa: Bulevar Slobode 15.
- Telefon: +381 11 123 4567

PRAVILA PONAŠANJA:
1. Odgovaraj uvek kratko, ljubazno i profesionalno.
2. NIKADA nemoj izmišljati jela, pića ili cene koje nisu na ovom spisku. Ako gost traži nešto čega nema, ponudi najbližu alternativu sa menija.
3. Ako gost želi REZERVACIJU, moraš od njega dobiti sledeće 4 informacije:
   - Ime na koga glasi rezervacija
   - Datum
   - Tačno vreme
   - Broj osoba
   Kada ti gost da sve ove podatke, potvrdno mu reci da je rezervacija zabeležena i u okviru svoje poruke na samom kraju dodaj tajni JSON kod u tačno ovom formatu:
   [[REZERVACIJA:{"ime":"Ime", "datum":"Datum", "vreme":"Vreme", "osoba":"Broj"}]]`;

    let chatHistory = [];

    function setApiKey() {
      const currentKey = localStorage.getItem('gemini_api_key') || '';
      const key = prompt("Unesite Vaš Gemini API ključ:", currentKey);
      if (key !== null) {
        localStorage.setItem('gemini_api_key', key.trim());
        alert("API ključ je sačuvan!");
      }
    }

    function toggleModal() {
      const modal = document.getElementById('resModal');
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
      } else {
        renderReservations();
        modal.style.display = 'flex';
      }
    }

    function saveReservation(data) {
      let reservations = JSON.parse(localStorage.getItem('gusto_reservations') || '[]');
      reservations.push({ ...data, timestamp: new Date().toLocaleString('sr-RS') });
      localStorage.setItem('gusto_reservations', JSON.stringify(reservations));
    }

    function renderReservations() {
      const listEl = document.getElementById('resList');
      const reservations = JSON.parse(localStorage.getItem('gusto_reservations') || '[]');
      
      if (reservations.length === 0) {
        listEl.innerHTML = '<p style="opacity:0.7;">Nema zabeleženih rezervacija.</p>';
        return;
      }

      listEl.innerHTML = reservations.map((r, i) => `
        <div class="res-card">
          <strong>👤 ${r.ime || 'N/A'}</strong><br>
          📅 Datum: ${r.datum || 'N/A'}<br>
          ⏰ Vreme: ${r.vreme || 'N/A'}<br>
          👥 Broj osoba: ${r.osoba || 'N/A'}<br>
          <small style="opacity:0.5;">Zabeleženo: ${r.timestamp}</small>
        </div>
      `).join('');
    }

    function clearReservations() {
      if (confirm('Da li ste sigurni da želite obrisati sve rezervacije?')) {
        localStorage.removeItem('gusto_reservations');
        renderReservations();
      }
    }

    async function sendMsg() {
      const input = document.getElementById('userInput');
      const chat = document.getElementById('chat');
      const text = input.value.trim();
      if (!text) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert("Kliknite na zupčanik ⚙️ i unesite API ključ!");
        return;
      }

      // Prikaz korisničke poruke
      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      
      // Indikator kucanja
      const typingDiv = document.createElement('div');
      typingDiv.className = 'msg bot typing';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerText = 'Konobar piše...';
      chat.appendChild(typingDiv);
      chat.scrollTop = chat.scrollHeight;

      // Dodajemo u istoriju
      chatHistory.push({ role: 'user', parts: [{ text: text }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: SYSTEM_INSTRUCTION }]
            },
            contents: chatHistory
          })
        });

        const data = await response.json();

        // Ukloni indikator kucanja
        const typingEl = document.getElementById('typingIndicator');
        if (typingEl) typingEl.remove();

        if (!response.ok) {
          const errDetail = data.error ? data.error.message : 'Greška pri odgovoru';
          throw new Error(`[Kod ${response.status}] ${errDetail}`);
        }

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          let reply = data.candidates[0].content.parts[0].text;
          
          // Provera da li odgovor sadrži podatke za rezervaciju
          const resMatch = reply.match(/\[\[REZERVACIJA:(.*?)\]\]/);
          if (resMatch) {
            try {
              const resData = JSON.parse(resMatch[1]);
              saveReservation(resData);
              // Uklanjamo tajni kod iz poruke koju prikazujemo gostu
              reply = reply.replace(/\[\[REZERVACIJA:(.*?)\]\]/, '');
            } catch (e) {
              console.error('Greška pri parsovanju rezervacije:', e);
            }
          }

          // Čuvanje odgovora modela u istoriji
          chatHistory.push({ role: 'model', parts: [{ text: reply }] });

          // Konverzija Markdown bold-a u HTML bold
          reply = reply.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

          chat.innerHTML += `<div class="msg bot">${reply}</div>`;
        } else {
          chat.innerHTML += `<div class="msg bot">Prazan odgovor od servera.</div>`;
        }

      } catch (err) {
        const typingEl = document.getElementById('typingIndicator');
        if (typingEl) typingEl.remove();
        chat.innerHTML += `<div class="msg bot" style="color:#ff6b6b;">${err.message}</div>`;
      }

      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
